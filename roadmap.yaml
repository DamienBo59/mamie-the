# Roadmap editoriale evergreen de mamie-the.fr
#
# 102 entrees, 284901 recherches mensuelles cumulees, du 2026-08-25 au 2027-08-13.
#
# Alimente /create-article-auto (publication automatique) et /create-article-seo
# (production en lot). Format documente dans .claude/templates/roadmap-template.yaml
# du template du parc.
#
# ORIGINE DES MOTS-CLES
# ---------------------
# Ce ne sont pas des suggestions d'outil : ce sont des requetes sur lesquelles les
# concurrents du the sont DEJA positionnes, relevees le 2026-08-20 via l'API
# Haloscan sur 7 sites (palaisdesthes, thesdelapagode, thes-traditions,
# jadore-le-the, le-the.fr, teaheritage, origeens), puis filtrees sur la pertinence
# thematique, l'intention informationnelle et le volume, et dedupliquees.
# Methode complete : Drive perso,
#   100 Areas/seo_freelance/Site web/parc-pbn/mamie-the.fr/
#     mamie-the - clusters et mots-cles 2026-08.md
#   (fiche detachee par site le 2026-09-12 ; nom exact sur le disque avec
#    accents : 'mamie-the - clusters et mots-clés 2026-08.md')
#   La comparaison avec les 2 autres niches du parc est restee a la racine,
#   dans 'parc - synthese comparative des 3 niches 2026-08.md'.
#
# CE QUE DISENT CES DONNEES
# -------------------------
# Sur le the, le lecteur ne vient pas pour devenir connaisseur : bienfaits et
# preparation pesent 43 % du volume, les tisanes 15 %, et la culture du the, le
# sujet le plus tentant a ecrire, seulement 12,9 %. Ecrire ce que cherche le
# lecteur, pas ce qui fait plaisir a l'auteur.
#
# ⚠️ YMYL SUR LA CATEGORIE "Bienfaits et sante"
# ----------------------------------------------
# Ces entrees touchent a la sante (`tisane de thym danger`, `tisane pour dormir`,
# `thes pour maigrir`). Regle non negociable, deja dans la fiche persona d'Helene
# Vasseur : temoignage d'usage et etat des connaissances, JAMAIS de promesse
# therapeutique, JAMAIS de posologie, JAMAIS de posture de soignant. Chaque
# article de cette categorie rappelle qu'une infusion ne remplace pas un avis
# medical.
#
# ⚠️ LE `kw` EST UNE REQUETE, PAS UN TITRE
# -----------------------------------------
# Certains mots-cles portent les fautes et la syntaxe des internautes
# (`the ala menthe`, `matcha latte tea`, `sauge pour tisane`). C'est normal, c'est
# ce qui est reellement tape. **Ne jamais reprendre la faute dans le titre ni dans
# le texte** : viser l'intention, ecrire un titre correct en francais.
#
# CADENCE ET DIVERSITE
# --------------------
# 2 articles par semaine, mardi et vendredi. La regle de diversite des categories
# est respectee et verifiee par script : aucune paire consecutive de meme
# categorie, et au moins 3 categories distinctes sur toute fenetre de 5 articles.
# En cas d'ajout manuel, reverifier.
#
# CHAMP kd
# --------
# Laisse a null volontairement. Haloscan ne fournit pas de Keyword Difficulty : son
# champ `competition` est publicitaire et non organique, l'utiliser comme KD serait
# faux. A remplir si un acces Semrush redevient disponible.
#
# CANNIBALISATION : 8 MOTS-CLES ECARTES
# ---------------------------------------
# Ils recoupaient un des 7 articles deja publies :
#   - the matcha (24600/mois) recoupe « Les bienfaits insoupçonnés du thé vert Matcha »
#   - matcha bienfaits (14700/mois) recoupe « Les bienfaits insoupçonnés du thé vert Matcha »
#   - the vert (8800/mois) recoupe « Les bienfaits insoupçonnés du thé vert Matcha »
#   - thé matcha bienfaits (4714/mois) recoupe « Les bienfaits insoupçonnés du thé vert Matcha »
#   - thé vert matcha (3682/mois) recoupe « Les bienfaits insoupçonnés du thé vert Matcha »
#   - thé vert sencha (3600/mois) recoupe « Sencha vs Gyokuro : quel thé vert japonais choisir ? »
#   - the earl grey (2636/mois) recoupe « Guide des thés noirs classiques : de l'Earl Grey au Darjeeling »
#   - the japonais vert (1714/mois) recoupe « Sencha vs Gyokuro : quel thé vert japonais choisir ? »
#
# A noter : `the vert` (8 800/mois) et `the matcha` (24 600/mois) sont les deux
# tetes de gondole de la thematique, et elles sont bloquees par deux articles
# courts de 2026-02. **Le bon reflexe n'est pas de les ajouter ici, c'est de
# reecrire ces deux articles en pages piliers.** Tant que ce n'est pas fait, ces
# volumes sont hors d'atteinte.
#
# Si un article existant est reecrit ou depublie, le mot-cle correspondant peut
# revenir dans cette roadmap.

