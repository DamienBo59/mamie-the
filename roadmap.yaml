# Roadmap editoriale evergreen de mamie-the.fr
#
# 52 entrees au 2026-10-04 (27 publiees ou programmees, 25 a ecrire jusqu'au
# 2027-02-19), mardi et vendredi. Plus bas, deux listes hors publication :
# `absorbed` (requetes couvertes par un article existant) et `dropped` (marques).
#
# Alimente /create-article-auto (publication automatique) et /create-article-seo
# (production en lot).
#
# ORIGINE DES MOTS-CLES
# ---------------------
# Ce ne sont pas des suggestions d'outil : ce sont des requetes sur lesquelles les
# concurrents du the sont DEJA positionnes, relevees le 2026-08-20 via l'API
# Haloscan sur 7 sites (palaisdesthes, thesdelapagode, thes-traditions,
# jadore-le-the, le-the.fr, teaheritage, origeens), puis filtrees sur la pertinence
# thematique, l'intention informationnelle et le volume, et dedupliquees.
#
# CE QUE DISENT CES DONNEES
# -------------------------
# Sur le the, le lecteur ne vient pas pour devenir connaisseur : bienfaits et
# preparation pesent 43 % du volume, les tisanes 15 %, et la culture du the, le
# sujet le plus tentant a ecrire, seulement 12,9 %. Ecrire ce que cherche le
# lecteur, pas ce qui fait plaisir a l'auteur.
#
# ⚠️ YMYL SUR LA CATEGORIE "Bienfaits et sante"
# ----------------------------------------------
# Ces entrees touchent a la sante. Regle non negociable : temoignage d'usage et
# etat des connaissances, JAMAIS de promesse therapeutique, JAMAIS de posologie,
# JAMAIS de posture de soignant. Chaque article de cette categorie rappelle
# qu'une infusion ne remplace pas un avis medical.
#
# ⚠️ LE `kw` EST UNE REQUETE, PAS UN TITRE
# -----------------------------------------
# Certains mots-cles portent les fautes et la syntaxe des internautes. C'est
# normal, c'est ce qui est reellement tape. **Ne jamais reprendre la faute dans le
# titre ni dans le texte** : viser l'intention, ecrire un titre correct.
#
# CHAMPS PROPRES A CE FICHIER
# ---------------------------
# - `secondary_kw` : requetes fusionnees dans l'entree, a couvrir dans le meme
#   article (H2 ou FAQ). Le `volume` de l'entree est alors la somme.
# - `angle` : ce qui distingue l'article des pages voisines deja publiees. A
#   respecter, c'est ce qui evite la cannibalisation.
#
# CADENCE ET DIVERSITE
# --------------------
# 2 articles par semaine, mardi et vendredi. Aucune paire consecutive de meme
# categorie, et au moins 3 categories distinctes sur toute fenetre de 5 articles
# (verifie par script le 2026-10-04). En cas d'ajout manuel, reverifier.
#
# CHAMP kd
# --------
# Laisse a null volontairement. Haloscan ne fournit pas de Keyword Difficulty : son
# champ `competition` est publicitaire et non organique.
#
# CANNIBALISATION
# ---------------
# Passe complete le 2026-10-04 sur les 75 entrees restantes : 36 requetes
# absorbees par un article existant (liste `absorbed`), 9 fusionnees dans une
# autre entree (`secondary_kw`), 5 marques retirees (liste `dropped`), 25 gardees,
# dont 9 avec un `angle` explicite. Les dates ont ete recompactees.
#
# Ecartes des l'origine, parce qu'ils recoupaient les articles de 2026-02 :
# the matcha (24600/mois), matcha bienfaits (14700), the vert (8800), the matcha
# bienfaits (4714), the vert matcha (3682), the vert sencha (3600), the earl grey
# (2636), the japonais vert (1714). `the vert` et `the matcha` sont les deux tetes
# de gondole de la thematique, bloquees par deux articles courts : **le bon
# reflexe est de reecrire ces articles en pages piliers**, pas de les ajouter ici.
#
# Avant chaque article, reverifier qu'il ne double pas une page publiee : le
# garde-fou lexical ne voit pas les synonymes.
