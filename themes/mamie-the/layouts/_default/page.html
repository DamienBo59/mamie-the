{{ define "main" }}
<div class="article-head">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="{{ "/" | relURL }}">Accueil</a> &rsaquo; <span>{{ .Title }}</span></nav>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="article-lead">{{ . }}</p>{{ end }}
  </div>
</div>
<section class="section">
  <div class="wrap-narrow">
    <div class="prose">{{ .Content }}</div>
    {{ with .Params.faq }}
    <section class="faq"><h2>Questions fréquentes</h2>{{ range . }}<details><summary>{{ .q }}</summary><div class="answer">{{ .a }}</div></details>{{ end }}</section>
    {{ end }}
    {{ partial "author-box.html" . }}
  </div>
</section>
{{ end }}
