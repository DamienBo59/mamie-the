<header class="site-header">
  <div class="header-in">
    <a href="{{ "/" | relURL }}" class="brand" aria-label="{{ .Site.Title }}, accueil">
      {{ partial "logo.html" . }}
      <span>
        <span class="brand-text">{{ .Site.Title }}</span>
        <span class="brand-sub">Le média du thé en vrac</span>
      </span>
    </a>

    <nav class="nav" aria-label="Navigation principale">
      {{ range .Site.Menus.main }}
        {{ $cta := eq .Name "Trouver mon thé" }}
        <a href="{{ .URL | relURL }}" class="{{ if $cta }}nav-cta{{ else if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
      {{ end }}
      <button class="search-btn" id="open-search" aria-label="Rechercher sur le site">{{ partial "icon.html" (dict "n" "search" "s" 18) }}</button>
    </nav>

    <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-mobile">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="nav-mobile" id="nav-mobile" aria-label="Navigation mobile">
    {{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
    <a href="#" id="open-search-m">Rechercher</a>
  </nav>
</header>

<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Recherche">
  <div class="search-panel">
    <input type="search" id="search-input" placeholder="Chercher un thé, une question, une plante…" autocomplete="off" aria-label="Votre recherche">
    <div class="search-results" id="search-results">
      <p class="search-empty">Tapez au moins deux lettres.</p>
    </div>
  </div>
</div>
