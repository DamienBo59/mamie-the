{{- $icon := . -}}
<div class="post-card-icon">
{{- if eq $icon "matcha" -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 22c0 7 5.4 12 12 12s12-5 12-12H8z" fill="currentColor" opacity="0.15"/><path d="M8 22c0 7 5.4 12 12 12s12-5 12-12H8z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 22h28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 6c0 4 4 4 4 8M20 6c0 4 4 4 4 8M24 6c0 4 4 4 4 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></svg>
{{- else if eq $icon "leaves" -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 30C10 30 12 10 30 8c0 0-2 20-20 22z" fill="currentColor" opacity="0.15"/><path d="M10 30C10 30 12 10 30 8c0 0-2 20-20 22z" stroke="currentColor" stroke-width="2"/><path d="M10 30C16 24 22 18 30 8" stroke="currentColor" stroke-width="1.5" opacity="0.5"/><path d="M15 25c2-3 5-6 9-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></svg>
{{- else if eq $icon "history" -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="6" width="24" height="28" rx="2" fill="currentColor" opacity="0.15"/><rect x="8" y="6" width="24" height="28" rx="2" stroke="currentColor" stroke-width="2"/><path d="M14 14h12M14 20h12M14 26h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/><path d="M8 10h2" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
{{- else if eq $icon "thermometer" -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="4" width="8" height="24" rx="4" fill="currentColor" opacity="0.15"/><rect x="16" y="4" width="8" height="24" rx="4" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="32" r="5" fill="currentColor" opacity="0.15"/><circle cx="20" cy="32" r="5" stroke="currentColor" stroke-width="2"/><path d="M20 28V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M26 10h4M26 16h3M26 22h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></svg>
{{- else if eq $icon "compare" -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 8l-4 12h16L18 8H10z" fill="currentColor" opacity="0.15"/><path d="M6 20h16M14 8L6 20M14 8l8 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 14l-4 12h16l-4-12h-8z" fill="currentColor" opacity="0.1"/><path d="M22 26h16M30 14l-8 12M30 14l8 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 8V4M30 14V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 4h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
{{- else if eq $icon "herbal" -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="18" r="6" fill="currentColor" opacity="0.15"/><circle cx="20" cy="18" r="6" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="18" r="2" fill="currentColor" opacity="0.4"/><path d="M20 12V7M26 14l4-3M26 22l4 3M14 14l-4-3M14 22l-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/><path d="M20 24v10M16 30l4-4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
{{- else if eq $icon "teacup" -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 16h24v4c0 6-4.8 10-12 10S6 26 6 20v-4z" fill="currentColor" opacity="0.15"/><path d="M6 16h24v4c0 6-4.8 10-12 10S6 26 6 20v-4z" stroke="currentColor" stroke-width="2"/><path d="M30 18h2a4 4 0 010 8h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 34h28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 8c0 3 3 3 3 6M18 6c0 3 3 3 3 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/></svg>
{{- else -}}
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="12" fill="currentColor" opacity="0.15"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="2"/><path d="M16 8c0 4 4 4 4 8M20 6c0 4 4 4 4 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/></svg>
{{- end -}}
</div>
