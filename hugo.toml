baseURL = 'https://www.mamie-the.fr/'
locale = 'fr-FR'
defaultContentLanguage = 'fr'
title = 'Mamie-Thé'
theme = 'mamie-the'
removePathAccents = true
enableRobotsTXT = true
enableEmoji = false
summaryLength = 30
buildFuture = false

[params]
  description = "Le média du thé en vrac : bienfaits, préparation, variétés et tisanes. Des guides précis, testés et écrits par une passionnée."
  tagline = "Thé en vrac, tisanes et rituels d'infusion"
  author = "helene-vasseur"
  logoText = "Mamie-Thé"
  siteStarted = 2026
  # Parametres SEO avances, lus par le partial seo-head.html
  author_name = "Hélène Vasseur"
  author_url = "https://www.mamie-the.fr/a-propos/"
  author_job_title = "Amatrice de thé et rédactrice"
  default_og_image = "/images/og-default.png"
  logo = "/favicon.svg"
  founding_year = "2026"
  expertise = ["Thés verts", "Thés noirs", "Infusions et tisanes", "Matériel et théières", "Rituels de préparation"]
  # Aucun formulaire d'inscription n'est branché : pas de newsletter tant qu'il n'y a pas de service derrière.

[author]
  name = "Hélène Vasseur"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[services]
  [services.rss]
    limit = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = false
    style = 'friendly'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[related]
  includeNewer = true
  threshold = 40
  toLower = true
  [[related.indices]]
    name = 'categories'
    weight = 60
  [[related.indices]]
    name = 'tags'
    weight = 40

[outputs]
  home = ['html', 'rss', 'json']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html', 'rss']

[outputFormats]
  [outputFormats.json]
    mediaType = 'application/json'
    baseName = 'index'
    isPlainText = true

[menus]
  [[menus.main]]
    name = 'Bienfaits'
    url = '/categories/bienfaits-et-sante/'
    weight = 1
  [[menus.main]]
    name = 'Préparation'
    url = '/categories/preparation-et-materiel/'
    weight = 2
  [[menus.main]]
    name = 'Variétés'
    url = '/categories/varietes-de-the/'
    weight = 3
  [[menus.main]]
    name = 'Tisanes'
    url = '/categories/tisanes-et-plantes/'
    weight = 4
  [[menus.main]]
    name = "Guide d'infusion"
    url = '/guide-infusion/'
    weight = 5
  [[menus.main]]
    name = 'Trouver mon thé'
    url = '/trouver-mon-the/'
    weight = 6

  [[menus.footer]]
    name = 'À propos'
    url = '/a-propos/'
    weight = 1
  [[menus.footer]]
    name = 'Glossaire du thé'
    url = '/glossaire/'
    weight = 2
  [[menus.footer]]
    name = 'Tous les articles'
    url = '/blog/'
    weight = 3
  [[menus.footer]]
    name = 'Plan du site'
    url = '/plan-du-site/'
    weight = 4
